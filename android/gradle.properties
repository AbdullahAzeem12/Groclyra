# Reduced heap to prevent Windows virtual-memory exhaustion (DOS error 1455)
# Old: -Xmx2048m caused JVM crash on machines with limited paging file
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m --enable-native-access=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
# Disable parallel execution to reduce peak memory usage
org.gradle.parallel=false
# Keep daemon alive but use a shorter idle timeout (3 min)
org.gradle.daemon.idletimeout=180000
android.useAndroidX=true
# Enable new DSL for AGP 9+
android.newDsl=false
# Disable Flutter's Built-In Kotlin support so plugins with kotlin-android can build
android.builtInKotlin=false
org.gradle.java.home=D:/Android Studio/jbr
# Fix: Kotlin incremental compiler crashes on Windows when pub cache (D:\) and
# project (C:\) are on different drives - RelocatableFileToPathConverter bug.
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.jvm.target.validation.mode=ignore
