name: groclyra
description: "Groclyra grocery shopping application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  sqflite: ^2.3.3+1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.4
  google_sign_in: ^6.2.2
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  package_info_plus: any
  http: ^1.2.2
  crypto: ^3.0.6
  path: ^1.9.0
  webview_flutter: ^4.8.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  pointycastle: ^3.9.1
  flutter_image_compress_lite: ^3.0.0
  local_auth: ^3.0.2
  flutter_tts: ^4.2.5
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.jpg"
  min_sdk_size: 192

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.jpg
    - assets/sql/
    - assets/sql/migrations/
